<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史报告</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --ink: #2b2620;
    --paper: #faf7f0;
    --rule: #d8cfbe;
    --accent: #8a5a44;
    --accent-soft: #e9ddd0;
    --green: #4a7c59;
    --green-soft: #e3ede7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    padding: 48px 20px;
    display: flex;
    justify-content: center;
  }

  .wrap { width: 100%; max-width: 760px; }

  /* 导航 */
  .nav {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
  }
  .nav a {
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .nav a:hover { text-decoration: underline; }
  .nav-sep { color: var(--rule); }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
    font-weight: 600;
  }
  h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px;
    margin-bottom: 6px;
    font-weight: 700;
  }

  /* 统计卡片 */
  .stats-row {
    display: flex;
    gap: 12px;
    margin: 24px 0 32px;
    flex-wrap: wrap;
  }
  .stat-card {
    flex: 1;
    min-width: 120px;
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 16px;
    text-align: center;
  }
  .stat-num {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 6px;
  }
  .stat-label { font-size: 12px; color: #8a7f6e; }

  /* 列表 */
  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .list-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }

  .report-list { display: flex; flex-direction: column; gap: 10px; }

  .report-card {
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .report-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(138,90,68,0.08); }

  .card-icon {
    font-size: 20px;
    margin-top: 2px;
    flex-shrink: 0;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .period-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .card-date { font-size: 12px; color: #8a7f6e; }
  .card-author { font-size: 12px; color: #a09080; }
  .card-preview {
    font-size: 13px;
    color: #6b6256;
    line-height: 1.6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    align-items: flex-start;
  }
  .btn-small {
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink);
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-small:hover { border-color: var(--accent); color: var(--accent); }
  .btn-small.danger:hover { border-color: #c0392b; color: #c0392b; }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #a09080;
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; margin-bottom: 16px; }
  .empty-link {
    display: inline-block;
    background: var(--ink);
    color: var(--paper);
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
  }

  /* 加载中 */
  .loading { text-align: center; padding: 40px; color: #a09080; font-size: 14px; }

  /* 弹窗 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    display: none;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--paper);
    border-radius: 8px;
    width: 100%;
    max-width: 680px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .modal-title { font-weight: 600; font-size: 15px; }
  .modal-close {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #8a7f6e;
    line-height: 1;
    padding: 0;
  }
  .modal-body {
    padding: 20px 24px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-report {
    font-size: 14px;
    line-height: 1.9;
    white-space: pre-wrap;
    color: var(--ink);
  }
  .modal-footer {
    padding: 14px 24px;
    border-top: 1px solid var(--rule);
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    flex-shrink: 0;
  }
  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 9px 18px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-primary:hover { background: var(--accent); }
  .btn-secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--rule);
    padding: 9px 18px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }

  /* 分页 */
  .pagination {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 24px;
  }
  .page-btn {
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink);
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .page-btn.active { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <a href="/">← 返回生成</a>
    <span class="nav-sep">|</span>
    <span style="font-size:13px;color:#8a7f6e;">历史报告</span>
  </div>

  <div class="eyebrow">报告存档</div>
  <h1>历史报告</h1>

  <!-- 统计卡片 -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="statTotal">—</div>
      <div class="stat-label">累计生成</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statMonth">—</div>
      <div class="stat-label">本月生成</div>
    </div>
    <div class="stat-card" style="flex:2;text-align:left;">
      <div style="font-size:12px;color:#8a7f6e;margin-bottom:4px;">最近生成时间</div>
      <div style="font-size:14px;font-weight:600;" id="statLatest">—</div>
    </div>
  </div>

  <div class="list-header">
    <div class="list-label">全部记录</div>
  </div>

  <div id="listContainer" class="loading">加载中…</div>
  <div class="pagination" id="pagination"></div>
</div>

<!-- 报告详情弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">报告详情</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-report" id="modalContent"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">关闭</button>
      <button class="btn-primary" id="modalExportBtn">导出 Word</button>
    </div>
  </div>
</div>

<script>
  let currentPage = 1;
  const pageSize = 10;
  let currentModalReportId = null;
  let currentModalPeriod = '';
  let currentModalAuthor = '';

  async function loadStats() {
    try {
      const res = await fetch('/api/stats');
      const data = await res.json();
      document.getElementById('statTotal').textContent = data.total_reports;
      document.getElementById('statMonth').textContent = data.this_month_count;
      document.getElementById('statLatest').textContent = data.latest_report_date || '暂无记录';
    } catch(e) {
      console.error('加载统计失败', e);
    }
  }

  async function loadReports(page) {
    const container = document.getElementById('listContainer');
    container.className = 'loading';
    container.innerHTML = '加载中…';

    try {
      const res = await fetch(`/api/reports?page=${page}&page_size=${pageSize}`);
      const data = await res.json();

      if (data.total === 0) {
        container.className = '';
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <div class="empty-text">还没有生成过报告</div>
            <a href="/" class="empty-link">去生成第一份</a>
          </div>`;
        return;
      }

      container.className = 'report-list';
      container.innerHTML = '';

      data.reports.forEach(r => {
        const date = formatDate(r.created_at);
        const card = document.createElement('div');
        card.className = 'report-card';
        card.innerHTML = `
          <div class="card-icon">📄</div>
          <div class="card-body">
            <div class="card-meta">
              <span class="period-tag">${r.period}</span>
              <span class="card-date">${date}</span>
              ${r.author_name ? `<span class="card-author">${r.author_name}</span>` : ''}
            </div>
            <div class="card-preview">${r.preview}</div>
          </div>
          <div class="card-actions">
            <button class="btn-small" onclick="viewReport(event,'${r.report_id}','${r.period}','${r.author_name}')">查看</button>
            <button class="btn-small danger" onclick="deleteReport(event,'${r.report_id}')">删除</button>
          </div>`;
        container.appendChild(card);
      });

      renderPagination(data.total, page);

    } catch(e) {
      container.className = '';
      container.innerHTML = `<div style="color:#a83a3a;font-size:14px;padding:20px">加载失败：${e.message}</div>`;
    }
  }

  function renderPagination(total, currentPage) {
    const totalPages = Math.ceil(total / pageSize);
    const el = document.getElementById('pagination');
    el.innerHTML = '';
    if (totalPages <= 1) return;

    const prev = document.createElement('button');
    prev.className = 'page-btn';
    prev.textContent = '上一页';
    prev.disabled = currentPage === 1;
    prev.onclick = () => { loadReports(currentPage - 1); window.currentPage = currentPage - 1; };
    el.appendChild(prev);

    for (let i = 1; i <= totalPages; i++) {
      const btn = document.createElement('button');
      btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
      btn.textContent = i;
      btn.onclick = (p => () => { loadReports(p); window.currentPage = p; })(i);
      el.appendChild(btn);
    }

    const next = document.createElement('button');
    next.className = 'page-btn';
    next.textContent = '下一页';
    next.disabled = currentPage === totalPages;
    next.onclick = () => { loadReports(currentPage + 1); window.currentPage = currentPage + 1; };
    el.appendChild(next);
  }

  async function viewReport(e, reportId, period, author) {
    e.stopPropagation();
    currentModalReportId = reportId;
    currentModalPeriod = period;
    currentModalAuthor = author;

    document.getElementById('modalTitle').textContent = `${period}报告`;
    document.getElementById('modalContent').textContent = '加载中…';
    document.getElementById('modalOverlay').classList.add('show');

    try {
      const res = await fetch(`/api/reports/${reportId}`);
      const data = await res.json();
      document.getElementById('modalContent').textContent = data.final_report || '内容为空';
    } catch(e) {
      document.getElementById('modalContent').textContent = '加载失败';
    }
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
    currentModalReportId = null;
  }

  document.getElementById('modalExportBtn').addEventListener('click', async () => {
    if (!currentModalReportId) return;
    const btn = document.getElementById('modalExportBtn');
    btn.disabled = true;
    btn.textContent = '导出中…';

    try {
      const res = await fetch('/api/export/word', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          report_id: currentModalReportId,
          author_name: currentModalAuthor,
          period: currentModalPeriod
        })
      });
      if (!res.ok) throw new Error('导出失败');
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `report_${currentModalReportId}.docx`;
      a.click();
      URL.revokeObjectURL(url);
    } catch(e) {
      alert(`导出失败：${e.message}`);
    } finally {
      btn.disabled = false;
      btn.textContent = '导出 Word';
    }
  });

  async function deleteReport(e, reportId) {
    e.stopPropagation();
    if (!confirm('确认删除这条报告？删除后无法恢复。')) return;

    try {
      const res = await fetch(`/api/reports/${reportId}`, { method: 'DELETE' });
      if (!res.ok) throw new Error('删除失败');
      loadReports(currentPage);
      loadStats();
    } catch(e) {
      alert(`删除失败：${e.message}`);
    }
  }

  function formatDate(isoStr) {
    if (!isoStr) return '';
    try {
      const d = new Date(isoStr);
      return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    } catch { return isoStr; }
  }

  // 点击遮罩关闭弹窗
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });

  // 初始化加载
  loadStats();
  loadReports(1);
</script>
</body>
</html>
